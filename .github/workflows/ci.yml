name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The unit tests only exercise the pure-Python analysis modules
      # (metrics, aggregate, topology, human_alignment), so we install just
      # their lightweight dependencies instead of the full torch/transformers
      # stack used by the GPU pipeline.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff numpy scipy pandas pyarrow pyyaml

      - name: Lint (ruff)
        run: ruff check src/

      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
