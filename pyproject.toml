[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ontogenia"
version = "0.1.0"
description = "Evaluación longitudinal de la emergencia sintáctica en Pythia y su alineación con la adquisición humana del lenguaje."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "datasets>=2.18",
    "accelerate>=0.28",
    "lm-eval>=0.4.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.scripts]
ontogenia = "ontogenia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
